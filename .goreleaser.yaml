version: 2

project_name: permidex

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/permidex
    binary: permidex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.md

checksum:
  name_template: "checksums.txt"

release:
  draft: true
