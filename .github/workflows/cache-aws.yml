name: Cache AWS

# Keeps the AWS catalogue cache warm and publishes it as a daily artifact. The job runs the latest released permidex,
# not main: it downloads the release archive, checks it against the release's signed checksums, and runs that binary.
# A broken commit on main can't break cache warming, and the release job restores the same cache (keyed on main, see
# release.yml), so the cache never ages out between releases. The AWS role's trust policy only accepts runs of
# laluowen/permidex on main, so this does nothing from any other ref.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Nothing by default: the job asks only for what it needs.
permissions: {}

concurrency:
  group: aws-catalogue
  cancel-in-progress: false

jobs:
  aws-catalogue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # sign in to AWS over OIDC
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The latest release, whose checksums are signed by the release workflow. The AWS provider only exists from
      # the release that first shipped it onwards: until then this job fails at the refresh step.
      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download --repo "$REPO" --dir "$RUNNER_TEMP/release" \
            --pattern checksums.txt \
            --pattern checksums.txt.sigstore.json \
            --pattern permidex_linux_amd64.tar.gz

      - name: Verify the release
        working-directory: ${{ runner.temp }}/release
        run: |
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf permidex_linux_amd64.tar.gz -C "$RUNNER_TEMP/bin" permidex

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: permidex-cache-${{ github.run_id }}
          aws-region: eu-north-1

      # Keyed on the run, restored from the newest run that saved one. The release job restores the same cache.
      - name: Restore the AWS catalogue cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/permidex/aws
          key: aws-catalogue-${{ github.run_id }}
          restore-keys: |
            aws-catalogue-

      - name: Refresh the AWS catalogue
        run: ${{ runner.temp }}/bin/permidex aws -r

      - name: Save the AWS catalogue cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/permidex/aws
          key: aws-catalogue-${{ github.run_id }}

      - name: Checksum and stage the catalogue
        run: |
          cp ~/.cache/permidex/aws/catalogue.json catalogue.json
          sha256sum catalogue.json > catalogue.json.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-catalogue
          path: |
            catalogue.json
            catalogue.json.sha256
          retention-days: 30
          if-no-files-found: error
