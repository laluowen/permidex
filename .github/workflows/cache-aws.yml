name: Cache AWS

# Keeps the AWS catalogue cache warm and publishes it as a daily artifact. The release job restores the same cache
# (keyed on main, see release.yml), so it refreshes only what changed, and the cache never ages out between
# releases. The AWS role's trust policy only accepts runs of laluowen/permidex on main, so this does nothing from any
# other ref.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Nothing by default: the job asks only for what it needs.
permissions: {}

concurrency:
  group: aws-catalogue
  cancel-in-progress: false

jobs:
  aws-catalogue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # sign in to AWS over OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: permidex-cache-${{ github.run_id }}
          aws-region: eu-north-1
      - name: Restore the AWS catalogue cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/permidex/aws
          key: aws-catalogue-${{ github.run_id }}
          restore-keys: |
            aws-catalogue-
      - name: Refresh the AWS catalogue
        run: go run ./cmd/permidex aws -r
      - name: Save the AWS catalogue cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/permidex/aws
          key: aws-catalogue-${{ github.run_id }}
      - name: Checksum and stage the catalogue
        run: |
          cp ~/.cache/permidex/aws/catalogue.json catalogue.json
          sha256sum catalogue.json > catalogue.json.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-catalogue
          path: |
            catalogue.json
            catalogue.json.sha256
          retention-days: 30
          if-no-files-found: error
