name: Cache AWS

# Keeps the AWS catalogue cache warm and publishes it as a daily artifact. The job runs a released permidex, not main:
# `mise exec` installs the pinned version from the GitHub release, and mise verifies the download (checksums and GitHub
# artifact attestations). release-please bumps the pin in each release PR (see release-please-config.json). A broken commit on main can't break cache warming, and the release job restores the same
# cache (keyed on main, see release.yml), so the cache never ages out between releases. The AWS role's trust policy
# only accepts runs of laluowen/permidex on main, so this does nothing from any other ref.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Nothing by default: the job asks only for what it needs.
permissions: {}

concurrency:
  group: aws-catalogue
  cancel-in-progress: false

jobs:
  aws-catalogue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # sign in to AWS over OIDC
    steps:
      # Job-level env can't use the runner context, so the directory is set here, for every later step.
      - name: Set the cache directory
        run: echo "PERMIDEX_CACHE_DIR=${{ runner.temp }}/permidex-cache" >> "$GITHUB_ENV"
      # Installs mise, which then installs permidex from the latest release. mise verifies the download against the
      # release's checksums and its GitHub artifact attestations.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: permidex-cache-${{ github.run_id }}
          aws-region: eu-north-1

      # Keyed on the run, restored from the newest run that saved one. The release job restores the same cache.
      - name: Restore the AWS catalogue cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PERMIDEX_CACHE_DIR }}/aws
          key: aws-catalogue-${{ github.run_id }}
          restore-keys: |
            aws-catalogue-

      - name: Refresh the AWS catalogue
        run: mise exec github:laluowen/permidex@2.3.1 -- permidex aws -r # x-release-please-version

      - name: Save the AWS catalogue cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PERMIDEX_CACHE_DIR }}/aws
          key: aws-catalogue-${{ github.run_id }}

      - name: Checksum and stage the catalogue
        run: |
          cp "$PERMIDEX_CACHE_DIR/aws/catalogue.json" catalogue.json
          sha256sum catalogue.json > catalogue.json.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-catalogue
          path: |
            catalogue.json
            catalogue.json.sha256
          retention-days: 30
          if-no-files-found: error
