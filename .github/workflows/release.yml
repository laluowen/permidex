name: Release

# Runs after CI succeeds on main (so a release PR is never opened, and a release
# never cut, from a commit that has not passed test/lint), or by hand from the
# Actions tab (run it on main).
#
# Manual runs:
# - no input: same as the automatic run. release-please opens or updates the
#   release PR, or cuts the release if the release PR was merged.
# - `tag` set: skip release-please and run only GoReleaser against that tag's
#   existing draft release. Use it to retry after a failed GoReleaser job.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release tag to build and publish (skips release-please). Leave empty for a normal run."
        required: false
        type: string

# Nothing by default: each job asks only for what it needs.
permissions: {}

# Releases queue behind each other rather than cancelling, so an in-flight release is never killed half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    timeout-minutes: 15
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.tag == '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write # open/update the release PR, create the tag + GitHub Release
      issues: write # label and comment on related issues
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Maintains a standing "chore(main): release X.Y.Z" PR from the
      # Conventional Commits merged since the last release. Merging it cuts the
      # release. It creates a DRAFT release and pushes the tag at once
      # (release-please-config.json: "draft", "force-tag-creation"). The
      # goreleaser job below attaches every asset to the draft, then publishes
      # it.
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the AWS catalogue for this release in its own job, so an AWS problem stops only this job, and it can be
  # re-run without touching the binaries. GoReleaser needs it: the catalogue is part of the release, and the
  # goreleaser job downloads it before GoReleaser runs, so checksums.txt covers it.
  aws-catalogue:
    needs: release-please
    timeout-minutes: 60
    # Same gate as goreleaser below: this builds for the same release.
    if: >-
      !cancelled() && !failure() && github.ref == 'refs/heads/main' &&
      (inputs.tag != '' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read CI runs for the release commit
      id-token: write # OIDC sign-in to AWS, through the role in vars.AWS_ROLE_ARN (trusts only main)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Verify CI for release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${release_sha}&per_page=100")"
            if jq -e --arg sha "$release_sha" '
              any(.workflow_runs[];
                .head_sha == $sha and
                .event == "push" and
                .head_branch == "main" and
                .status == "completed" and
                .conclusion == "success"
              )
            ' <<< "$runs" > /dev/null; then
              echo "CI passed for release commit ${release_sha}"
              exit 0
            fi
            sleep 15
          done
          echo "No successful CI run found for release commit ${release_sha}" >&2
          exit 1

      # One explicit cache directory for restore, save and the copy below, so it doesn't depend on the runner's
      # XDG_CACHE_HOME. Job-level env can't use the runner context, so it's set here, for every later step.
      - name: Set the cache directory
        run: echo "PERMIDEX_CACHE_DIR=${{ runner.temp }}/permidex-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: permidex-release-${{ github.run_id }}
          aws-region: eu-north-1
      # The previous catalogue is restored from the cache, so `aws -r` only fetches what changed since the last
      # release. The daily job (cache-aws.yml) keeps this cache warm, and it is keyed on main. If the cache's format
      # version doesn't match, permidex does a full refresh.
      - name: Restore the AWS catalogue cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PERMIDEX_CACHE_DIR }}/aws
          key: aws-catalogue-${{ github.run_id }}
          restore-keys: |
            aws-catalogue-
      - name: Build the AWS catalogue
        run: |
          go run ./cmd/permidex aws -r
          cp "$PERMIDEX_CACHE_DIR/aws/catalogue.json" aws-catalogue.json
      - name: Save the AWS catalogue cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PERMIDEX_CACHE_DIR }}/aws
          key: aws-catalogue-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-catalogue
          path: aws-catalogue.json
          retention-days: 1
          if-no-files-found: error

  goreleaser:
    needs: [release-please, aws-catalogue]
    timeout-minutes: 60
    # release-please is skipped when `tag` is given, so don't require it to have run.
    if: >-
      !cancelled() && !failure() && github.ref == 'refs/heads/main' &&
      (inputs.tag != '' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the GitHub Release
      id-token: write # keyless signing (cosign) and attestations: the job's OIDC token
      attestations: write # store build provenance attestations
      actions: read # verify CI for the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the tag explicitly, not the branch tip: it gives
          # GoReleaser `{{ .Tag }}` and `{{ .Version }}` to build.
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Verify CI for release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${release_sha}&per_page=100")"
            if jq -e --arg sha "$release_sha" '
              any(.workflow_runs[];
                .head_sha == $sha and
                .event == "push" and
                .head_branch == "main" and
                .status == "completed" and
                .conclusion == "success"
              )
            ' <<< "$runs" > /dev/null; then
              echo "CI passed for release commit ${release_sha}"
              exit 0
            fi
            sleep 15
          done
          echo "No successful CI run found for release commit ${release_sha}" >&2
          exit 1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The AWS catalogue from the aws-catalogue job, into the workspace root where .goreleaser.yaml expects it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aws-catalogue
          path: .

      # cosign signs checksums.txt keylessly, and Syft writes each archive's
      # SBOM from its build hook (see `signs` and `builds.hooks` in
      # .goreleaser.yaml). Both must be on PATH before GoReleaser runs.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Builds linux/darwin x amd64/arm64, packs each into an archive with its
      # SBOM and LICENSE.md, writes and signs checksums, uploads everything to
      # the draft release, then publishes it (`release.use_existing_draft` +
      # `draft: false`). If it fails before that, the draft is still unsealed:
      # re-run the failed job, or run this workflow by hand with `tag` set.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for every archive in checksums.txt, verifiable
      # with `gh attestation verify`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
